# continue.dev 配置文件
name: DeepSeek Assistant
version: 1.0.0

models:
  # === 主力：代码理解 + 复杂编辑（类 Codex Chat）===
  - name: DeepSeek-Chat
    provider: deepseek
    model: deepseek-chat      # 使用 DeepSeek 聊天推理模型
    apiKey: <DEEPSEEK-API-KEY>
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 32768 maxTokens: 4096
      temperature: 0.15    # 偏向确定性输出，有助于编程任务
      topP: 0.95

  # === 主力：自动补全（尽量接近 Copilot）===
  - name: DeepSeek-Coder
    provider: deepseek
    model: deepseek-coder     # 使用 DeepSeek 专门的代码生成模型
    apiKey: <DEEPSEEK-API-KEY>
    roles:
      - autocomplete          # 自动补全
    defaultCompletionOptions:
      contextLength: 32768
      maxTokens: 2048         # 允许更长的生成，提高补全质量
      temperature: 0.1        # 更保守，减少无关生成

# 上下文提供者，让模型能理解项目代码
context:
  # 顺序很重要：Continue 会按顺序拼 prompt
  - provider: diff
  - provider: file
  - provider: folder
  - provider: code

# 规则（可选）：比如统一输出风格、注释风格等
# rules:
#   - uses: rules/deepseek-coding.md

# 自定义快速提示（可选）
prompts:
  - name: Default Coding Behavior
    description: Global coding rules for TypeScript and Python.
    prompt: |
      You are an experienced senior software engineer.

      First, detect the programming language from the context.
      Then strictly follow the corresponding rules below.

      --- TypeScript Rules ---
      - Always assume strict mode is enabled.
      - Prefer explicit types over implicit inference for public APIs.
      - Use interfaces or type aliases appropriately; do not mix arbitrarily.
      - Avoid `any` unless explicitly justified.
      - Prefer immutable data structures where possible.
      - For async code, handle errors explicitly (try/catch or Result-style).
      - When editing code, preserve existing style and naming conventions.
      - If refactoring, explain the trade-offs briefly before applying changes.

      --- Python Rules ---
      - Assume Python 3.10+ unless specified otherwise.
      - Prefer type hints (PEP 484 / PEP 544 / PEP 544 protocols when relevant).
      - Use dataclasses or pydantic models when modeling structured data.
      - Be explicit about edge cases and error handling.
      - Prefer clarity over cleverness.
      - Avoid unnecessary abstractions.
      - When refactoring, preserve behavior unless explicitly asked to change it.

      Do not add explanations unless requested.
      Focus on correct, maintainable, production-quality code.

  - name: Explain Code (TS / Python)
    description: Explain code with an engineering focus.
    prompt: |
      Explain the selected code from an engineering perspective.

      - Identify the core responsibility of the code.
      - Call out any TypeScript or Python-specific pitfalls.
      - Mention potential edge cases or hidden assumptions.
      - If applicable, suggest one concrete improvement.

      Be concise and technical. Avoid restating obvious syntax.

